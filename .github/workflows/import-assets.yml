name: Bootstrap Next.js source

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.issue.title == 'bootstrap-koprualti-nextjs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: true
      - name: Validate and expand source payload
        run: |
          set -euo pipefail
          tar -tzf bootstrap/source.tar.gz >/dev/null
          tar -xzf bootstrap/source.tar.gz
      - name: Import assets from legacy repository
        run: |
          set -euo pipefail
          rm -rf /tmp/koprualti-html
          git clone --depth 1 https://github.com/ZiyaattinAydn/koprualti-tattoo-taslak-HTML.git /tmp/koprualti-html
          rm -rf public/assets
          mkdir -p public
          cp -a /tmp/koprualti-html/assets public/assets
      - name: Commit complete project
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/import-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Köprüaltı Next.js project"
          git push origin HEAD:main
