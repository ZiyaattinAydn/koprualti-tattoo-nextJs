name: Bootstrap Next.js source

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.issue.title == 'bootstrap-koprualti-nextjs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Next.js repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: true

      - name: Rebuild and validate source payload
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/parts/part-* | base64 -d > /tmp/source.tar.gz
          echo "ad07c1a1997283ecd5e99c8b2fed1e23eb6df060179f95cf92e57f2c8fdfd1d9  /tmp/source.tar.gz" | sha256sum -c -
          tar -tzf /tmp/source.tar.gz >/dev/null
          tar -xzf /tmp/source.tar.gz

      - name: Import assets from legacy HTML repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/koprualti-html
          git clone --depth 1 https://github.com/ZiyaattinAydn/koprualti-tattoo-taslak-HTML.git /tmp/koprualti-html
          rm -rf public/assets
          mkdir -p public
          cp -a /tmp/koprualti-html/assets public/assets

      - name: Install dependencies and verify project
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check

      - name: Commit complete project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/import-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Köprüaltı Next.js project"
          git push origin HEAD:main
