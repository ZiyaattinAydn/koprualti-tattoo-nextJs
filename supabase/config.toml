# Local development configuration. Hosted project settings are configured separately.
project_id = "koprualti-tattoo"
[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
major_version = 17
[db.seed]
enabled = false
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/artist-studio/auth/callback/"]
enable_signup = false
minimum_password_length = 12
[auth.email]
enable_signup = false
[storage]
enabled = true
file_size_limit = "8MiB"
